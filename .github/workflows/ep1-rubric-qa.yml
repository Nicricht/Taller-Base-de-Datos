name: EP1 Rubric QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rubric-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar cumplimiento estático del informe EP1
        run: python qa/validate_ep1.py

      - name: Validar presentación EP1 contra la pauta
        run: python qa/validate_presentacion_ep1.py
