name: EP1 Rubric QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rubric-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de presentación
        run: python -m pip install --disable-pip-version-check python-pptx Pillow

      - name: Generar presentación EP1
        run: python qa/build_presentacion_ep1.py

      - name: Validar cumplimiento estático del informe EP1
        run: python qa/validate_ep1.py

      - name: Validar presentación EP1 contra la pauta
        run: python qa/validate_presentacion_ep1.py

      - name: Versionar presentación generada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/presentacion/EDUBIO360_EP1_PRESENTACION_FINAL.pptx
          if ! git diff --cached --quiet; then
            git commit -m "docs: generar presentacion EP1 [skip ci]"
            git push
          fi
